name: CI

on:
  pull_request: ~
  push:
    branches:
      - '*'

jobs:
  cs:
    name: Coding Style
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ecs
        run: cd tools/ecs && composer update --no-interaction

      - name: Run the CS fixer
        run: composer cs-fixer
